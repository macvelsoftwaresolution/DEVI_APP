# DEVI Women Safety Network — Production NGINX for Backend API & WebSockets
# Subdomain: devi-api.macvelsoftware.com
# Proxies to Node.js Backend on Port 5005

server {
    listen 80;
    server_name devi-api.macvelsoftware.com;

    # Maximum file upload size for 2-minute emergency video/audio evidence
    client_max_body_size 100M;

    # Gzip Compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    location / {
        proxy_pass http://127.0.0.1:5005;
        proxy_http_version 1.1;

        # WebSocket Upgrade Headers (Crucial for Live Map Radar & GPS Streams)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Forward Original Client Headers to Express (trust proxy)
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Keep-Alive timeouts for persistent live SOS tracking streams
        proxy_connect_timeout 60s;
        proxy_send_timeout 86400s;
        proxy_read_timeout 86400s;
    }
}
