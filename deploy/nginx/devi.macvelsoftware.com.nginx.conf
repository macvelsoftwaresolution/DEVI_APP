# DEVI Women Safety Network — Production NGINX for React Frontend Web Portal
# Subdomain: devi.macvelsoftware.com
# Serves static React Vite bundle

server {
    listen 80;
    server_name devi.macvelsoftware.com;

    root /var/www/DEVI_APP/web/dist;
    index index.html;

    # Gzip Compression for ultra-fast load
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # Security headers (keep the CSP in sync with web/public/.htaccess)
    # CSP is Report-Only: violations show in the browser console but nothing is blocked.
    # Once the console is clean, rename the header to Content-Security-Policy to enforce it.
    add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' https://maps.googleapis.com https://maps.gstatic.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://unpkg.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https://*.googleapis.com https://*.gstatic.com https://*.google.com https://*.ggpht.com https://*.basemaps.cartocdn.com; media-src 'self' blob: https://devi-api.macvelsoftware.com; connect-src 'self' https://devi-api.macvelsoftware.com wss://devi-api.macvelsoftware.com https://*.googleapis.com https://nominatim.openstreetmap.org https://router.project-osrm.org; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # React Router SPA routing fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Static Assets caching
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
