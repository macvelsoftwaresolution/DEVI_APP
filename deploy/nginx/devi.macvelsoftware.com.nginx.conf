# DEVI Women Safety Network — Production NGINX for React Frontend Web Portal
# Subdomain: devi.macvelsoftware.com
# Serves static React Vite bundle

server {
    listen 80;
    server_name devi.macvelsoftware.com;

    root /var/www/DEVI_APP/web/dist;
    index index.html;

    # Gzip Compression for ultra-fast load
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # Security headers (CSP enforced, HSTS, etc.): deploy/nginx/snippets/devi-web-security-headers.conf
    include /etc/nginx/snippets/devi-web-security-headers.conf;

    # React Router SPA routing fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Static Assets caching
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        # add_header here drops the server-level headers, so include them again
        include /etc/nginx/snippets/devi-web-security-headers.conf;
    }
}
