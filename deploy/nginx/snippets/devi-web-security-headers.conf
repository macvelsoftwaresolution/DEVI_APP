# Security headers for devi.macvelsoftware.com (keep in sync with web/public/.htaccess)
# Server path: /etc/nginx/snippets/devi-web-security-headers.conf
# Included in every location that has its own add_header: nginx drops the server-level
# add_header lines inside such a location, so they would be missing on /assets/ files.
#
# CSP (enforced): the site only loads its own files, Google Fonts and the DEVI API
# (REST, WebSocket and the evidence video stream). Map links open in a new tab, so no map hosts.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; media-src 'self' blob: https://devi-api.macvelsoftware.com; connect-src 'self' https://devi-api.macvelsoftware.com wss://devi-api.macvelsoftware.com; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests" always;
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
