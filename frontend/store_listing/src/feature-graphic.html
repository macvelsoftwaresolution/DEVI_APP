<!doctype html>
<html>
<head>
<meta charset="utf-8">
<!-- Play Store feature graphic, rendered to PNG at exactly 1024x500 (see render.ps1) -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Poppins:wght@500;600&display=swap">
<style>
  html, body { margin: 0; width: 1024px; height: 500px; overflow: hidden; }
  body {
    /* matches the logo's own navy so the emblem blends in */
    background:
      radial-gradient(ellipse 520px 420px at 250px 250px, rgba(255, 176, 32, 0.16), transparent 70%),
      linear-gradient(120deg, #010715 0%, #071433 60%, #0b1c45 100%);
    font-family: Poppins, "Segoe UI", sans-serif;
    color: #fff;
    position: relative;
  }
  .logo {
    position: absolute; left: 64px; top: 50px;
    width: 400px; height: 400px; border-radius: 50%;
    -webkit-mask-image: radial-gradient(circle, #000 66%, transparent 71%);
            mask-image: radial-gradient(circle, #000 66%, transparent 71%);
  }
  .copy { position: absolute; left: 500px; right: 56px; top: 0; bottom: 0;
          display: flex; flex-direction: column; justify-content: center; gap: 18px; }
  .eyebrow { font-size: 18px; font-weight: 600; letter-spacing: 0.22em; color: #ffb52e; text-transform: uppercase; }
  h1 { margin: 0; font-family: Cinzel, Georgia, serif; font-size: 52px; line-height: 1.08;
       background: linear-gradient(180deg, #ffe38a, #ffb21f 55%, #f08a0c);
       -webkit-background-clip: text; background-clip: text; color: transparent; }
  .points { display: flex; flex-direction: column; gap: 10px; font-size: 21px; font-weight: 500; color: #e6ebf7; }
  .points span::before { content: ""; display: inline-block; width: 10px; height: 10px; border-radius: 50%;
                         background: #ff3b4e; margin-right: 14px; vertical-align: middle; box-shadow: 0 0 10px #ff3b4e; }
</style>
</head>
<body>
  <img class="logo" src="logo.png" alt="">
  <div class="copy">
    <div class="eyebrow">Women Safety SOS</div>
    <h1>Help is one<br>press away</h1>
    <div class="points">
      <span>Live location to your guardians</span>
      <span>Instant WhatsApp alert &amp; call</span>
      <span>Private video &amp; audio evidence</span>
    </div>
  </div>
</body>
</html>
